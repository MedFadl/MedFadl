name: Generate languages card

on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Generate Dark Theme Languages - Custom Blue Theme
      - name: generate languages-dark.svg
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&locale=en&hide_title=false&layout=compact&card_width=320&langs_count=10&hide_border=true&custom_title=Most%20Used%20Languages&bg_color=0D1117&title_color=58a6ff&text_color=C9D1D9
          path: dist/languages-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Generate Light Theme Languages - Custom Blue Theme
      - name: generate languages-light.svg
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&locale=en&hide_title=false&layout=compact&card_width=320&langs_count=10&hide_border=true&custom_title=Most%20Used%20Languages&bg_color=ffffff&title_color=0969da&text_color=24292f
          path: dist/languages-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Push both SVGs to the output branch
      - name: push languages to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: languages-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
