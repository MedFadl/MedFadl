name: Generate stats card

on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Generate Dark Theme Stats - Custom Blue Theme
      - name: generate stats-dark.svg
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&locale=en&hide_border=true&bg_color=0D1117&title_color=58a6ff&text_color=C9D1D9&icon_color=58a6ff
          path: dist/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Generate Light Theme Stats - Custom Blue Theme
      - name: generate stats-light.svg
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&locale=en&hide_border=true&bg_color=ffffff&title_color=0969da&text_color=24292f&icon_color=0969da
          path: dist/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Push both SVGs to the output branch
      - name: push stats to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
