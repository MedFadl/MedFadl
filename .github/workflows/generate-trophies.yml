name: Generate trophies card

on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate trophies.svg
        uses: ryo-ma/github-profile-trophy@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: darkhub # Sleek, dark, and matches your other stats
          column: 7 # Forces up to 7 trophies into a single row
          no-bg: true # Keeps it transparent
          no-frame: true # Removes the individual trophy boxes completely
          margin-w: 15 # Compresses the spacing slightly
          margin-h: 15

      - name: move and prepare output
        run: |
          mkdir -p dist
          mv trophies.svg dist/trophies.svg

      - name: push trophies to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophies-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
