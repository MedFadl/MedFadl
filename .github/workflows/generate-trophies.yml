name: Generate trophies card

on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Use an action specifically for trophies
      - name: generate trophies.svg
        uses: ryo-ma/github-profile-trophy@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: dark # Trophies generally have specific themes
          column: 3 # Match your layout
          no-bg: true # Make it transparent
          no-border: true
          margin-w: 15
          margin-h: 15

      # Move the generated file to a dist folder
      - name: move and prepare output
        run: |
          mkdir -p dist
          mv trophies.svg dist/trophies.svg

      # Push the trophies SVG to a new output branch
      - name: push trophies to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophies-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
